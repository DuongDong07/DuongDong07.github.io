<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Contact Us - Flower Shop</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="wrap">
        <header id="header">
            <div id="logo"><img src="images/flower-shop-logo.avif" width="191" height="66" alt="Flower Shop" /></div>
            <nav id="menu_top">
                <ul class="level1">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Introduction</a></li>
                    <li><a href="#">Flower Category</a></li>
                    <li><a href="dangky.html">Register</a></li>
                    <li><a href="#">Login</a></li>
                    <li><a href="lienhe.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <section id="center_content">
            <div class="title" style="margin-bottom: 20px;">
                <img src="images/bullet2.gif" align="top" /> Contact Information
            </div>

            <div style="display: flex; gap: 30px; padding: 0 20px;">
                <div style="flex: 1;">
                    <h3>Flower Shop Headquarters</h3>
                    <p><strong>Address:</strong> 01 - Hoa Binh - Ninh Kieu Dist - CanTho City</p>
                    <p><strong>Phone:</strong> 0900 000 001</p>
                    <p><strong>Email:</strong> support@flowershop.vn</p>
                </div>

                <div style="flex: 1;">
                    <form action="#" method="post">
                        <table width="100%" cellpadding="5">
                            <tr>
                                <td>Your Name:</td>
                                <td><input type="text" name="name" style="width: 100%;" /></td>
                            </tr>
                            <tr>
                                <td>Subject:</td>
                                <td><input type="text" name="subject" style="width: 100%;" /></td>
                            </tr>
                            <tr>
                                <td>Message:</td>
                                <td><textarea name="message" rows="5" style="width: 100%;"></textarea></td>
                            </tr>
                            <tr>
                                <td></td>
                                <td><button type="submit">Send Message</button></td>
                            </tr>
                        </table>
                    </form>
                </div>
            </div>
        </section>

        <div style="clear:both"></div>
        <footer id="footer">
            <div class="left"> Flower Shop Co., Ltd - Vietnam Branch </div>
            <div class="right"><img src="images/flower-shop-footer.webp" /></div>
        </footer>
    </div>
</body>
</html>
