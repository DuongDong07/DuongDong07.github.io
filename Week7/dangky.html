<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Register - Flower Shop</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="wrap">
        <header id="header">
            <div id="logo"><img src="images/flower-shop-logo.avif" width="191" height="66" alt="Flower Shop" /></div>
            <nav id="menu_top">
                <ul class="level1">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Introduction</a></li>
                    <li><a href="#">Flower Category</a></li>
                    <li><a href="dangky.html">Register</a></li>
                    <li><a href="#">Login</a></li>
                    <li><a href="lienhe.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <section id="center_content">
            <div class="title" style="margin-bottom: 20px;">
                <img src="images/bullet1.gif" align="top" /> User Registration
            </div>
            
            <form action="#" method="post" style="padding: 20px; border: 1px solid #ddd; width: 50%; margin: 0 auto;">
                <table width="100%" cellpadding="10">
                    <tr>
                        <td>Full Name:</td>
                        <td><input type="text" name="fullname" style="width: 100%;" /></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="email" name="email" style="width: 100%;" /></td>
                    </tr>
                    <tr>
                        <td>Username:</td>
                        <td><input type="text" name="user" style="width: 100%;" /></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password" name="pass" style="width: 100%;" /></td>
                    </tr>
                    <tr>
                        <td>Confirm Pass:</td>
                        <td><input type="password" name="repass" style="width: 100%;" /></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Register Now" />
                            <input type="reset" value="Clear" />
                        </td>
                    </tr>
                </table>
            </form>
        </section>

        <div style="clear:both"></div>
        <footer id="footer">
            <div class="left"> Flower Shop Co., Ltd - Vietnam Branch </div>
            <div class="right"><img src="images/flower-shop-footer.webp" /></div>
        </footer>
    </div>
</body>
</html>
